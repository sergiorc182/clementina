<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción a Materias y Gestión Académica | ISFT 182</title>
    <meta name="description" content="Sistema de Gestión Académica - Inscripción online a cursadas de 2º y 3º año con validación automática de correlatividades y carga horaria. Desarrollado en JavaScript Vanilla puro." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
