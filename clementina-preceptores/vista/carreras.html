<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carreras · Panel Administrativo · Clementina · ISFT N.º 182</title>
  <meta name="robots" content="noindex, nofollow">
  <script>try { if (localStorage.getItem('clementina-tema') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); } } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../vista/estilo/estilo.css?v=15">
  <link rel="stylesheet" href="estilo/admin.css?v=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317324D'/%3E%3Cpath d='M22 11.5a7 7 0 1 0 0 9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='2.2' fill='%2314B8A6'/%3E%3C/svg%3E">
</head>
<body data-page="carreras">
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden aria-hidden="true"></div>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación del panel"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar" role="banner"></header>
      <main id="contenido" class="admin-content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">Carreras</h1>
            <p class="page-head__text">Carreras registradas en el sistema y cantidad de alumnos matriculados.</p>
          </div>
        </div>
        <div class="table-wrap">
          <table class="table" id="tabla-carreras" aria-label="Carreras">
            <thead>
              <tr>
                <th>Carrera</th>
                <th>Nombre corto</th>
                <th>Resolución</th>
                <th class="num">Matriculados</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
              <tr><td colspan="4" style="text-align:center; color:var(--text-2); padding:var(--sp-8);">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="../../vista/estilo/app.js?v=13"></script>
  <script src="estilo/app-admin.js?v=3"></script>
  <script>
    (function () {
      'use strict';
      AppAdmin.montarAdmin({ titulo: 'Carreras', subtitulo: 'Oferta académica' })
        .then(function (usuario) {
          if (!usuario) { return; }
          fetch(AppAdmin.controladorAdmin('dashboard.php'))
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (!res.ok) { return; }
              var carreras = res.data.carreras || [];
              var tbody = document.getElementById('tabla-body');
              if (!carreras.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-2); padding:var(--sp-8);">Sin carreras registradas.</td></tr>';
                return;
              }
              tbody.innerHTML = carreras.map(function (c) {
                return '<tr>' +
                  '<td class="col-main"><strong>' + esc(c.nombre_carrera) + '</strong></td>' +
                  '<td><span class="badge badge--neutral">' + esc(c.nombre_carrera_corto) + '</span></td>' +
                  '<td>' + esc(c.nro_resolucion || '—') + '</td>' +
                  '<td class="num">' + (parseInt(c.matriculados) || 0) + '</td>' +
                '</tr>';
              }).join('');
            })
            .catch(function () {
              App.toast({ tipo: 'error', titulo: 'Error', texto: 'No se pudieron cargar las carreras.' });
            });
        });

      function esc(txt) {
        return String(txt == null ? '' : txt).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      }
    })();
  </script>
</body>
</html>
