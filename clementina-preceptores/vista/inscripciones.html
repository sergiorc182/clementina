<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripciones a finales · Panel Administrativo · Clementina · ISFT N.º 182</title>
  <meta name="robots" content="noindex, nofollow">
  <script>try { if (localStorage.getItem('clementina-tema') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); } } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../vista/estilo/estilo.css?v=15">
  <link rel="stylesheet" href="estilo/admin.css?v=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317324D'/%3E%3Cpath d='M22 11.5a7 7 0 1 0 0 9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='2.2' fill='%2314B8A6'/%3E%3C/svg%3E">
</head>
<body data-page="inscripciones">
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden aria-hidden="true"></div>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación del panel"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar" role="banner"></header>
      <main id="contenido" class="admin-content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">Inscripciones a finales</h1>
            <p class="page-head__text">Listado de todas las inscripciones a mesas de examen registradas en el sistema.</p>
          </div>
        </div>
        <!-- Filtros -->
        <div class="toolbar mb-4">
          <div class="field field--icon" style="flex:1 1 260px; margin:0;">
            <i data-lucide="search" class="field__icon icon--sm"></i>
            <input type="search" id="input-busqueda" class="input" placeholder="Buscar por alumno, materia o carrera…" autocomplete="off">
          </div>
          <select class="select" id="filtro-estado" style="flex:none;">
            <option value="">Todos los estados</option>
            <option value="A">Activa</option>
            <option value="C">Cancelada</option>
          </select>
        </div>
        <!-- Tabla -->
        <div class="table-wrap table-wrap--stack">
          <table class="table" id="tabla-inscripciones" aria-label="Inscripciones a finales">
            <thead>
              <tr>
                <th>Alumno</th>
                <th>Materia</th>
                <th>Carrera</th>
                <th>Turno</th>
                <th>Año</th>
                <th>Fecha inscripción</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
              <tr><td colspan="7" style="text-align:center; color:var(--text-2); padding:var(--sp-8);">Cargando inscripciones…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="row between mt-4">
          <span id="total-info" class="muted" style="font-size:.875rem;"></span>
          <div class="row" id="paginacion" style="gap:var(--sp-2);"></div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="../../vista/estilo/app.js?v=13"></script>
  <script src="estilo/app-admin.js?v=3"></script>
  <script src="estilo/inscripciones.js?v=1"></script>
</body>
</html>
