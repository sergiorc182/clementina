<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesas de examen · Panel Administrativo · Clementina · ISFT N.º 182</title>
  <meta name="robots" content="noindex, nofollow">
  <script>try { if (localStorage.getItem('clementina-tema') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); } } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../vista/estilo/estilo.css?v=15">
  <link rel="stylesheet" href="estilo/admin.css?v=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317324D'/%3E%3Cpath d='M22 11.5a7 7 0 1 0 0 9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='2.2' fill='%2314B8A6'/%3E%3C/svg%3E">
</head>
<body data-page="mesas">
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden aria-hidden="true"></div>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación del panel"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar" role="banner"></header>
      <main id="contenido" class="admin-content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">Mesas de examen</h1>
            <p class="page-head__text">Períodos de inscripción a finales configurados en el sistema.</p>
          </div>
        </div>
        <div class="card">
          <div class="card__body">
            <div id="lista-mesas">
              <div class="empty">
                <div class="empty__icon"><i data-lucide="calendar-days" class="icon"></i></div>
                <div class="empty__title">Cargando períodos…</div>
              </div>
            </div>
            <form id="form-mesas" class="form-grid" style="margin-top:1rem;" hidden>
              <div class="field">
                <label class="label" for="m-anio">Año de mesas *</label>
                <input class="input" id="m-anio" type="number" min="2000" max="2100" required>
              </div>
              <div class="field">
                <label class="label" for="m-id-turno">Turno *</label>
                <select class="input" id="m-id-turno" required></select>
              </div>
              <div class="field">
                <label class="label" for="m-fecha-inicio">Fecha inicio</label>
                <input class="input" id="m-fecha-inicio" type="date">
              </div>
              <div class="field">
                <label class="label" for="m-fecha-fin">Fecha fin</label>
                <input class="input" id="m-fecha-fin" type="date">
              </div>
              <div class="field">
                <label class="label" for="m-tope">Tope de mesas por alumno</label>
                <input class="input" id="m-tope" type="number" min="0" max="999">
              </div>
              <div class="field" style="align-self:end;">
                <button type="button" class="btn btn--primary" id="btn-guardar-mesas"><i data-lucide="save" class="icon--sm"></i> Guardar</button>
              </div>
            </form>
          </div>
        </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="../../vista/estilo/app.js?v=15"></script>
  <script src="estilo/app-admin.js?v=7"></script>
  <script>
    (function () {
      'use strict';
      var datosGlobal = null;
      var turnosGlobal = [];

      AppAdmin.montarAdmin({ titulo: 'Mesas de examen', subtitulo: 'Per��odos configurados' })
        .then(function (usuario) {
          if (!usuario) { return; }
          cargarMesas();
          document.getElementById('btn-guardar-mesas').addEventListener('click', guardarMesas);
        });

      function cargarMesas() {
        fetch(AppAdmin.controladorAdmin('parametros.php'))
          .then(function (r) { return r.json(); })
          .then(function (res) {
            var contenedor = document.getElementById('lista-mesas');
            if (!res.ok) {
              contenedor.innerHTML = '<p class="muted" style="font-size:.875rem;">No se pudieron cargar los per��odos.</p>';
              return;
            }
            datosGlobal = res.datos || {};
            turnosGlobal = res.turnos || [];
            var m = (datosGlobal.mesas || {});
            document.getElementById('m-anio').value = m.anio_mesas || '';
            document.getElementById('m-id-turno').innerHTML = '<option value="">Seleccion��</option>' + turnosGlobal.map(function (t) {
              var sel = String(t.id_turno) === String(m.id_turno) ? ' selected' : '';
              return '<option value="' + esc(t.id_turno) + '"' + sel + '>' + esc(t.turno) + '</option>';
            }).join('');
            document.getElementById('m-fecha-inicio').value = m.fecha_inicio ? String(m.fecha_inicio).substring(0, 10) : '';
            document.getElementById('m-fecha-fin').value = m.fecha_fin ? String(m.fecha_fin).substring(0, 10) : '';
            document.getElementById('m-tope').value = m.tope_mesas || '';
            contenedor.innerHTML = '';
            document.getElementById('form-mesas').hidden = false;
            App.iconos();
          })
          .catch(function () {
            document.getElementById('lista-mesas').innerHTML = '<p class="muted" style="font-size:.875rem;">Error al cargar.</p>';
          });
      }

      function guardarMesas() {
        if (!datosGlobal) return;
        var g = datosGlobal.generales || {};
        var i = datosGlobal.inscripcion || {};
        var mt = datosGlobal.matriculacion || {};
        var a = datosGlobal.aspirantes || {};
        var datos = new URLSearchParams();
        datos.append('accion', 'guardar');
        datos.append('nombre_instituto', g.nombre_instituto || '');
        datos.append('ciclo_lectivo', g.ciclo_lectivo || '');
        datos.append('anio_mesas', document.getElementById('m-anio').value || '');
        datos.append('id_turno', document.getElementById('m-id-turno').value || '');
        datos.append('mesas_fecha_inicio', document.getElementById('m-fecha-inicio').value || '');
        datos.append('mesas_fecha_fin', document.getElementById('m-fecha-fin').value || '');
        datos.append('tope_mesas', document.getElementById('m-tope').value || '');
        datos.append('anio_inscripcion_carrera', i.anio_inscripcion_carrera || '');
        datos.append('inscripcion_fecha_inicio', i.fecha_inicio ? String(i.fecha_inicio).substring(0, 10) : '');
        datos.append('inscripcion_fecha_fin', i.fecha_fin ? String(i.fecha_fin).substring(0, 10) : '');
        datos.append('anio_matriculacion', mt.anio_matriculacion || '');
        datos.append('matriculacion_fecha_inicio', mt.fecha_inicio ? String(mt.fecha_inicio).substring(0, 10) : '');
        datos.append('matriculacion_fecha_fin', mt.fecha_fin ? String(mt.fecha_fin).substring(0, 10) : '');
        datos.append('carpeta_vista_alumno', mt.carpeta_vista_alumno || '');
        datos.append('carpeta_vista_preceptoria', mt.carpeta_vista_preceptoria || '');
        datos.append('anio_aspirantes', a.anio || '');

        var btn = document.getElementById('btn-guardar-mesas');
        btn.disabled = true;
        fetch(AppAdmin.controladorAdmin('parametros.php'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: datos.toString()
        })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res.ok) { App.toast({ tipo: 'error', titulo: 'Error', texto: res.mensaje || 'No se pudo guardar.' }); return; }
            App.toast({ tipo: 'success', titulo: 'Mesas', texto: res.mensaje || 'Guardado.' });
            if (res.datos) { datosGlobal = res.datos; }
          })
          .catch(function () { App.toast({ tipo: 'error', titulo: 'Error', texto: 'No se pudo guardar.' }); })
          .then(function () { btn.disabled = false; });
      }

      function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; });
      }
    })();
  </script>
</body>
</html>
