<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de preceptores · Clementina · ISFT N.º 182</title>
  <meta name="description" content="Panel de administración para preceptores del ISFT N.º 182 Clementina.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vista/estilo/panel.css?v=5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317324D'/%3E%3Cpath d='M22 11.5a7 7 0 1 0 0 9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='2.2' fill='%2314B8A6'/%3E%3C/svg%3E">
</head>
<body data-panel="preceptores">

  <a class="salto" href="#contenido">Saltar al contenido</a>

  <div class="app">
    <div class="app__main">
      <header class="topbar">
        <div class="panel-topbar__brand">
          <span class="brand__mark">
            <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
              <path d="M21.5 11.4a7 7 0 1 0 0 9.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path>
              <circle cx="21.5" cy="16" r="2.2" fill="#14B8A6"></circle>
            </svg>
          </span>
          <div>
            <div class="brand__name">Clementina</div>
            <div class="brand__sub">ISFT N.º 182</div>
          </div>
        </div>

        <span class="panel-topbar__tag">Panel de preceptores</span>
        <div class="topbar__spacer"></div>

        <div class="panel-user">
          <span class="avatar" id="panel-usuario-avatar">P</span>
          <div class="user-chip__info">
            <span class="panel-user__name" id="panel-usuario-nombre">Preceptor</span>
            <span class="panel-user__role">Preceptor</span>
          </div>
        </div>
        <button type="button" class="btn btn--outline btn--sm" id="btn-cerrar-sesion">
          <i data-lucide="log-out"></i> Salir
        </button>
      </header>

      <main id="contenido" class="content content--wide">

        <div class="page-head">
          <div class="page-head__lead">
            <div>
              <h1 class="page-head__title">Panel de preceptores</h1>
              <p class="page-head__text">
                Validá las cursadas de los alumnos y administrá los datos académicos.
              </p>
            </div>
          </div>
        </div>

        <div class="card" id="cargando">
          <div class="card__body">
            <div class="skeleton skeleton--text" style="width: 25%"></div>
            <div class="skeleton skeleton--line" style="width: 60%; margin-top: 14px;"></div>
            <div class="skeleton skeleton--line" style="width: 50%; margin-top: 10px;"></div>
          </div>
        </div>

        <div class="admin oculto" id="admin">
          <aside class="admin__nav" id="admin-nav" aria-label="Entidades"></aside>
          <section class="admin__panel" id="admin-panel" aria-live="polite"></section>
        </div>

      </main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="vista/estilo/panel.js?v=5"></script>
</body>
</html>
