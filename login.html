<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de preceptores · Clementina · ISFT N.º 182</title>
  <meta name="description" content="Acceso al panel de preceptores del ISFT N.º 182 Clementina.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vista/estilo/panel.css?v=5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317324D'/%3E%3Cpath d='M22 11.5a7 7 0 1 0 0 9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='2.2' fill='%2314B8A6'/%3E%3C/svg%3E">
</head>
<body data-panel="preceptores">

  <main class="panel-login">
    <section class="panel-login__card" aria-labelledby="titulo-login">

      <div class="panel-login__brand">
        <span class="brand__mark">
          <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <path d="M21.5 11.4a7 7 0 1 0 0 9.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path>
            <circle cx="21.5" cy="16" r="2.2" fill="#14B8A6"></circle>
          </svg>
        </span>
        <div>
          <div class="brand__name">Clementina</div>
          <div class="brand__sub">ISFT N.º 182</div>
        </div>
      </div>

      <h1 class="panel-login__title" id="titulo-login">Panel de preceptores</h1>
      <p class="panel-login__subtitle">Ingresá con tu usuario de preceptor.</p>

      <form id="form-login" class="mt-4" novalidate>
        <div class="field">
          <label class="label" for="usuario">Usuario</label>
          <input class="input" type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
        </div>

        <div class="field">
          <label class="label" for="password">Contraseña</label>
          <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <p class="mensaje" id="mensaje" role="alert"></p>

        <button class="btn btn--primary btn--block" type="submit" id="boton-ingresar">
          Ingresar
        </button>
      </form>

      <p class="panel-login__foot">
        Acceso exclusivo para personal con rol de preceptor.
      </p>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('form-login');
      var boton = document.getElementById('boton-ingresar');
      var mensaje = document.getElementById('mensaje');

      function mostrar(texto, ok) {
        mensaje.textContent = texto;
        mensaje.className = 'mensaje mensaje-visible ' + (ok ? 'mensaje-exito' : 'mensaje-error');
      }

      fetch('controlador/verificar_sesion.php')
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          if (datos.ok && datos.usuario && datos.usuario.tipo === 'personal' && datos.usuario.rol === 'preceptor') {
            window.location.href = 'index.html';
            return;
          }
          if (datos.ok && datos.usuario && datos.usuario.rol === 'alumno') {
            mostrar('Hay una sesión de alumno activa. Ingresá con una cuenta de preceptor para continuar.', false);
          }
        })
        .catch(function () { /* sin sesión */ });

      form.addEventListener('submit', function (evento) {
        evento.preventDefault();

        var usuario = document.getElementById('usuario').value.trim();
        var password = document.getElementById('password').value;

        if (!usuario || !password) {
          mostrar('Ingresá usuario y contraseña.', false);
          return;
        }

        boton.disabled = true;
        boton.textContent = 'Verificando...';

        fetch('controlador/login_preceptor.php', {
          method: 'POST',
          body: new FormData(form)
        })
          .then(function (r) { return r.json(); })
          .then(function (resultado) {
            if (resultado.ok) {
              mostrar(resultado.mensaje || 'Ingreso correcto.', true);
              window.setTimeout(function () {
                window.location.href = 'index.html';
              }, 350);
            } else {
              mostrar(resultado.mensaje || 'No se pudo iniciar sesión.', false);
            }
          })
          .catch(function () {
            mostrar('Error de red o del servidor. Intentá de nuevo.', false);
          })
          .finally(function () {
            boton.disabled = false;
            boton.textContent = 'Ingresar';
          });
      });
    })();
  </script>
</body>
</html>
