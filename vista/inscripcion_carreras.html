<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción a carreras - ISFT 182 Clementina</title>
  <link rel="stylesheet" href="estilo/estilo.css">
</head>
<body>

  <header class="cabecera">
    <div>
      <h1>Inscripción a carreras</h1>
      <p class="subtitulo">ISFT 182 Clementina</p>
    </div>
    <div class="cabecera-usuario">
      <span id="nombre-usuario" class="usuario-nombre"></span>
      <a class="boton boton-secundario" href="../index.html">Volver al menú</a>
    </div>
  </header>

  <main class="contenedor">
    <div class="tarjeta">
      <h2 class="titulo-seccion">En construcción</h2>
      <p>
        Este formulario se completará en el próximo paso. Se conectará con las
        tablas <code>aspirantes</code> e <code>inscripciones</code> del esquema normalizado.
      </p>
    </div>
  </main>

  <footer class="pie">ISFT 182 "Clementina"</footer>

  <script src="estilo/app.js"></script>
  <script>
    App.verificarSesion().then(function (usuario) {
      if (usuario) {
        document.getElementById('nombre-usuario').textContent =
          usuario.nombre + ' ' + (usuario.apellido || '') + ' (' + App.nombreRol(usuario.rol) + ')';
      }
    });
  </script>
</body>
</html>
