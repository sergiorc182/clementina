<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis datos · Clementina · ISFT N.º 182</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo/estilo.css?v=10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317324D'/%3E%3Cpath d='M22 11.5a7 7 0 1 0 0 9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='2.2' fill='%2314B8A6'/%3E%3C/svg%3E">
</head>
<body data-page="mis-datos" data-title="Mis datos" data-subtitle="Información personal">

  <a class="salto" href="#contenido">Saltar al contenido</a>

  <div class="app">

    <div class="app__main">
      <header class="topbar" id="topbar"></header>

      <main id="contenido" class="content content--narrow">

        <div class="page-head">
          <div class="page-head__lead">
            <a class="btn btn--ghost btn--icon" href="../index.html" aria-label="Volver al inicio" title="Volver">
              <i data-lucide="arrow-left"></i>
            </a>
            <div>
              <h2 class="page-head__title">Mis datos</h2>
              <p class="page-head__text">Información personal registrada en la institución.</p>
            </div>
          </div>
        </div>

        <p id="mensaje" class="mensaje" role="alert"></p>

        <!-- Carga -->
        <div class="card" id="cargando">
          <div class="card__body">
            <div class="skeleton skeleton--text" style="width: 30%"></div>
            <div class="skeleton skeleton--line" style="width: 70%; margin-top: 14px;"></div>
            <div class="skeleton skeleton--line" style="width: 55%; margin-top: 10px;"></div>
            <div class="skeleton skeleton--line" style="width: 62%; margin-top: 10px;"></div>
          </div>
        </div>

        <!-- Datos editables -->
        <div class="card oculto" id="tarjeta-datos">
          <div class="card__header">
            <div>
              <h3 class="card__title">Datos personales</h3>
              <p class="card__subtitle">Editá tus datos y guardá los cambios</p>
            </div>
            <span class="stat__icon"><i data-lucide="user"></i></span>
          </div>
          <div class="card__body">
            <form id="form-datos" novalidate>
              <div class="grid grid--2">
                <div class="field">
                  <label class="label" for="primer_nombre">Primer nombre <span class="req">*</span></label>
                  <input class="input" type="text" id="primer_nombre" name="primer_nombre" maxlength="40" required>
                </div>
                <div class="field">
                  <label class="label" for="otros_nombres">Otros nombres</label>
                  <input class="input" type="text" id="otros_nombres" name="otros_nombres" maxlength="40">
                </div>
                <div class="field">
                  <label class="label" for="primer_apellido">Primer apellido <span class="req">*</span></label>
                  <input class="input" type="text" id="primer_apellido" name="primer_apellido" maxlength="40" required>
                </div>
                <div class="field">
                  <label class="label" for="otros_apellidos">Otros apellidos</label>
                  <input class="input" type="text" id="otros_apellidos" name="otros_apellidos" maxlength="40">
                </div>
                <div class="field">
                  <label class="label" for="dni">DNI</label>
                  <input class="input" type="text" id="dni" disabled aria-describedby="dni-hint">
                  <p class="field__hint" id="dni-hint">El documento no se puede modificar.</p>
                </div>
                <div class="field">
                  <label class="label" for="email">Email <span class="req">*</span></label>
                  <input class="input" type="email" id="email" name="email" maxlength="255" required>
                </div>
                <div class="field">
                  <label class="label" for="fecha_nacimiento">Fecha de nacimiento</label>
                  <input class="input" type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                </div>
                <div class="field">
                  <label class="label" for="sexo">Sexo</label>
                  <select class="select" id="sexo" name="sexo">
                    <option value="">Sin especificar</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="X">Otro / No binario</option>
                  </select>
                </div>
                <div class="field">
                  <label class="label" for="estado_civil">Estado civil</label>
                  <select class="select" id="estado_civil" name="estado_civil">
                    <option value="">Sin especificar</option>
                    <option value="S">Soltero/a</option>
                    <option value="C">Casado/a</option>
                    <option value="D">Divorciado/a</option>
                    <option value="V">Viudo/a</option>
                    <option value="U">Unión de hecho</option>
                  </select>
                </div>
                <div class="field">
                  <label class="label" for="id_pais_nacimiento">País de nacimiento</label>
                  <select class="select" id="id_pais_nacimiento" name="id_pais_nacimiento">
                    <option value="">Cargando…</option>
                  </select>
                </div>
                <div class="field">
                  <label class="label" for="id_provincia">Provincia</label>
                  <select class="select" id="id_provincia">
                    <option value="">Cargando…</option>
                  </select>
                </div>
                <div class="field">
                  <label class="label" for="id_localidad_nacimiento">Localidad de nacimiento</label>
                  <select class="select" id="id_localidad_nacimiento" name="id_localidad_nacimiento">
                    <option value="">Sin especificar</option>
                  </select>
                </div>
                <div class="field">
                  <label class="label" for="lugar_nacimiento_extranjero">Lugar de nacimiento en el extranjero</label>
                  <input class="input" type="text" id="lugar_nacimiento_extranjero" name="lugar_nacimiento_extranjero" maxlength="100" placeholder="Solo si naciste fuera del país">
                </div>
                <div class="field">
                  <label class="label" for="cantidad_hijos">Cantidad de hijos</label>
                  <input class="input" type="number" id="cantidad_hijos" name="cantidad_hijos" min="0" step="1" value="0">
                </div>
                <div class="field">
                  <label class="label" for="cantidad_familiares_a_cargo">Familiares a cargo</label>
                  <input class="input" type="number" id="cantidad_familiares_a_cargo" name="cantidad_familiares_a_cargo" min="0" step="1" value="0">
                </div>
                <div class="field">
                  <label class="label" for="telefono_principal">Teléfono</label>
                  <input class="input" type="tel" id="telefono_principal" name="telefono_principal" maxlength="45">
                </div>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn--primary" id="btn-guardar">
                  <i data-lucide="save"></i> Guardar cambios
                </button>
              </div>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="estilo/app.js?v=9"></script>
  <script>
    (function () {
      'use strict';

      var mensaje = document.getElementById('mensaje');
      var cargando = document.getElementById('cargando');
      var tarjeta = document.getElementById('tarjeta-datos');
      var form = document.getElementById('form-datos');
      var btnGuardar = document.getElementById('btn-guardar');

      function mostrar(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = 'mensaje mensaje-visible ' + (tipo === 'ok' ? 'mensaje-exito' : 'mensaje-error');
        window.clearTimeout(mostrar._t);
        mostrar._t = window.setTimeout(function () {
          mensaje.className = 'mensaje';
        }, 5000);
      }

      function finalizarCarga() {
        cargando.classList.add('oculto');
        App.iconos();
      }

      function setValor(id, v) {
        document.getElementById(id).value = (v === null || v === undefined) ? '' : v;
      }

      function cargarSelect(select, url, sinDatos) {
        return fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (lista) {
            select.innerHTML = '';
            if (!lista.length) {
              var vacio = document.createElement('option');
              vacio.value = '';
              vacio.textContent = sinDatos;
              select.appendChild(vacio);
              return;
            }
            var sin = document.createElement('option');
            sin.value = '';
            sin.textContent = 'Sin especificar';
            select.appendChild(sin);
            lista.forEach(function (item) {
              var opt = document.createElement('option');
              opt.value = item.id_pais !== undefined ? item.id_pais : item.id_localidad;
              opt.textContent = item.nombre || '(sin nombre)';
              select.appendChild(opt);
            });
          });
      }

      function cargarProvincias() {
        var sel = document.getElementById('id_provincia');
        return fetch(App.controlador('get_provincias.php'))
          .then(function (r) { return r.json(); })
          .then(function (lista) {
            sel.innerHTML = '';
            var vacio = document.createElement('option');
            vacio.value = '';
            vacio.textContent = lista.length ? 'Todas' : 'Sin provincias cargadas';
            sel.appendChild(vacio);
            lista.forEach(function (p) {
              var opt = document.createElement('option');
              opt.value = p.id_provincia;
              opt.textContent = p.nombre || '(sin nombre)';
              sel.appendChild(opt);
            });
          });
      }

      function cargarLocalidades(idProvincia, seleccion) {
        var sel = document.getElementById('id_localidad_nacimiento');
        var url = App.controlador('get_localidades.php') + (idProvincia ? '?id_provincia=' + encodeURIComponent(idProvincia) : '');
        return fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (lista) {
            sel.innerHTML = '';
            if (!lista.length) {
              var vacio = document.createElement('option');
              vacio.value = '';
              vacio.textContent = 'Sin localidades cargadas';
              sel.appendChild(vacio);
              return;
            }
            var sin = document.createElement('option');
            sin.value = '';
            sin.textContent = 'Sin especificar';
            sel.appendChild(sin);
            lista.forEach(function (l) {
              var opt = document.createElement('option');
              opt.value = l.id_localidad;
              opt.textContent = l.nombre || '(sin nombre)';
              sel.appendChild(opt);
            });
            if (seleccion) { sel.value = seleccion; }
          });
      }

      function precargar(d) {
        setValor('primer_nombre', d.primer_nombre);
        setValor('otros_nombres', d.otros_nombres);
        setValor('primer_apellido', d.primer_apellido);
        setValor('otros_apellidos', d.otros_apellidos);
        setValor('dni', d.numero_documento);
        setValor('email', d.email);
        setValor('fecha_nacimiento', d.fecha_nacimiento);
        setValor('sexo', d.sexo);
        setValor('estado_civil', d.estado_civil);
        setValor('lugar_nacimiento_extranjero', d.lugar_nacimiento_extranjero);
        setValor('cantidad_hijos', d.cantidad_hijos === null ? 0 : d.cantidad_hijos);
        setValor('cantidad_familiares_a_cargo', d.cantidad_familiares_a_cargo === null ? 0 : d.cantidad_familiares_a_cargo);
        setValor('telefono_principal', d.telefono_principal);
      }

      function recargar() {
        return fetch(App.controlador('mis_datos.php'))
          .then(function (resp) { return resp.json(); })
          .then(function (d) {
            if (d.error) {
              mostrar(d.error, 'error');
              return;
            }
            return Promise.all([
              cargarSelect(document.getElementById('id_pais_nacimiento'), App.controlador('get_paises.php'), 'Sin países cargados'),
              cargarProvincias()
            ]).then(function () {
              return cargarLocalidades('', d.id_localidad_nacimiento);
            }).then(function () {
              document.getElementById('id_pais_nacimiento').value = d.id_pais_nacimiento || '';
              precargar(d);
              tarjeta.classList.remove('oculto');
              App.iconos();
            });
          });
      }

      document.getElementById('id_provincia').addEventListener('change', function () {
        cargarLocalidades(this.value, '');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        btnGuardar.disabled = true;
        var datos = new URLSearchParams(new FormData(form)).toString();
        fetch(App.controlador('mis_datos.php'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: datos
        })
          .then(function (r) { return r.json(); })
          .then(function (r) {
            btnGuardar.disabled = false;
            if (r.ok) {
              mostrar(r.mensaje, 'ok');
              recargar();
            } else {
              mostrar(r.mensaje || 'No se pudieron guardar los datos.', 'error');
            }
          })
          .catch(function () {
            btnGuardar.disabled = false;
            mostrar('Error de red o del servidor.', 'error');
          });
      });

      App.montarLayout().then(function (usuario) {
        if (!usuario) { return; }
        recargar()
          .then(finalizarCarga)
          .catch(function () {
            finalizarCarga();
            mostrar('Error de red o del servidor.', 'error');
          });
      });
    })();
  </script>
</body>
</html>
